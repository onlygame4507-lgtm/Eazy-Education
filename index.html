<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyHub Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .container { width: 100%; max-width: 900px; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1, h2, h3 { color: var(--accent); margin-bottom: 15px; }
    .hidden { display: none !important; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 14px; }
    input, textarea, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; }
    button { background: var(--accent); color: #000; font-weight: bold; padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    button:hover { background: var(--accent-hover); color: #fff; }
    button.btn-danger { background: var(--danger); color: #fff; }
    button.btn-secondary { background: #475569; color: #fff; }
    .nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .alert { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; }
    .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; }
    .alert-success { background: rgba(34, 197, 94, 0.2); border: 1px solid var(--success); color: #86efac; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 10px; border: 1px solid #334155; text-align: left; }
    th { background: #0f172a; }

    /* Video Protection CSS */
    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin: 15px 0;
      user-select: none;
      -webkit-user-select: none;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
      outline: none;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Supabase Credentials Setup -->
  <div id="config-section">
    <h2>Supabase Config</h2>
    <div class="form-group"><label>Supabase URL</label><input type="text" id="cfg-url" placeholder="https://xyz.supabase.co" /></div>
    <div class="form-group"><label>Supabase Anon Key</label><input type="password" id="cfg-key" placeholder="your-anon-key" /></div>
    <button onclick="initSupabase()">Save & Connect</button>
  </div>

  <div id="app-section" class="hidden">
    <div class="nav">
      <span id="user-info" style="align-self:center; font-weight:bold; margin-right:auto;"></span>
      <button id="btn-login-view" onclick="showAuth('login')">Login</button>
      <button id="btn-reg-view" onclick="showAuth('register')">Register</button>
      <button id="btn-admin-view" onclick="showAuth('admin')">Admin Login</button>
      <button id="btn-logout" class="btn-danger hidden" onclick="logout()">Logout</button>
    </div>

    <div id="msg-box"></div>

    <!-- Auth: Student Login -->
    <div id="auth-login" class="auth-card hidden">
      <h2>Student Login</h2>
      <div class="form-group"><label>Username / Phone</label><input type="text" id="login-id" /></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-pass" /></div>
      <button onclick="handleStudentLogin()">Login</button>
    </div>

    <!-- Auth: Student Registration -->
    <div id="auth-register" class="auth-card hidden">
      <h2>Student Registration</h2>
      <div class="form-group"><label>Full Name</label><input type="text" id="reg-name" /></div>
      <div class="form-group"><label>Username / Phone</label><input type="text" id="reg-id" /></div>
      <div class="form-group"><label>Password (Min 6 chars)</label><input type="password" id="reg-pass" /></div>
      <button onclick="handleStudentRegister()">Register</button>
    </div>

    <!-- Auth: Admin Login -->
    <div id="auth-admin" class="auth-card hidden">
      <h2>Admin Login</h2>
      <div class="form-group"><label>Admin Password</label><input type="password" id="admin-pass" /></div>
      <button onclick="handleAdminLogin()">Login as Admin</button>
    </div>

    <!-- Student Dashboard -->
    <div id="student-dash" class="hidden">
      <h2>Learning Content</h2>
      <div id="content-display">Loading content...</div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dash" class="hidden">
      <h2>Admin Dashboard</h2>
      
      <h3>1. Site Content Management (JSON)</h3>
      <div class="form-group">
        <textarea id="site-json-input" rows="8" placeholder='{"subjects":[{"name":"Math","videos":["https://example.com/video.mp4"]}]}'></textarea>
      </div>
      <button onclick="handleSaveSiteContent()">Save Content</button>

      <hr style="margin:25px 0; border-color:#334155;" />

      <h3>2. Student Management</h3>
      <button class="btn-secondary" onclick="loadStudentList()">Refresh Student List</button>
      <div id="student-list-container"></div>

      <hr style="margin:25px 0; border-color:#334155;" />

      <h3>3. Change Admin Password</h3>
      <div class="form-group"><label>Current Admin Password</label><input type="password" id="old-admin-pass" /></div>
      <div class="form-group"><label>New Admin Password</label><input type="password" id="new-admin-pass" /></div>
      <button onclick="handleChangeAdminPassword()">Update Admin Password</button>
    </div>
  </div>
</div>

<script>
  let sbClient = null;
  let currentUser = null; 
  let currentAdminPassword = "";

  function showMessage(msg, isError = false) {
    const box = document.getElementById('msg-box');
    box.innerHTML = `<div class="alert ${isError ? 'alert-error' : 'alert-success'}">${msg}</div>`;
    setTimeout(() => box.innerHTML = '', 4000);
  }

  function initSupabase() {
    const url = document.getElementById('cfg-url').value.trim();
    const key = document.getElementById('cfg-key').value.trim();
    if(!url || !key) return alert('Supabase URL & Key enter korun.');

    sbClient = supabase.createClient(url, key);
    document.getElementById('config-section').classList.add('hidden');
    document.getElementById('app-section').classList.remove('hidden');
    showAuth('login');
    loadPublicData();
  }

  function hideAllViews() {
    ['auth-login', 'auth-register', 'auth-admin', 'student-dash', 'admin-dash'].forEach(id => {
      document.getElementById(id).classList.add('hidden');
    });
  }

  function showAuth(type) {
    hideAllViews();
    if(type === 'login') document.getElementById('auth-login').classList.remove('hidden');
    if(type === 'register') document.getElementById('auth-register').classList.remove('hidden');
    if(type === 'admin') document.getElementById('auth-admin').classList.remove('hidden');
  }

  // --- Student Auth ---
  async function handleStudentRegister() {
    const name = document.getElementById('reg-name').value;
    const login_id = document.getElementById('reg-id').value;
    const password = document.getElementById('reg-pass').value;

    const { data, error } = await sbClient.rpc('register_student', {
      p_name: name, p_login_id: login_id, p_password: password
    });

    if(error || !data.success) {
      return showMessage(data?.message || error?.message || 'Registration failed', true);
    }
    showMessage('Registration successful! Please login.');
    showAuth('login');
  }

  async function handleStudentLogin() {
    const login_id = document.getElementById('login-id').value;
    const password = document.getElementById('login-pass').value;

    const { data, error } = await sbClient.rpc('login_student', {
      p_login_id: login_id, p_password: password
    });

    if(error || !data.success) {
      return showMessage(data?.message || error?.message || 'Login failed', true);
    }

    currentUser = { role: 'student', name: data.name, id: data.id };
    updateUIState();
  }

  // --- Admin Auth & Actions ---
  async function handleAdminLogin() {
    const pass = document.getElementById('admin-pass').value;

    const { data, error } = await sbClient.rpc('admin_login', { p_password: pass });

    if(error || !data.success) {
      return showMessage(data?.message || error?.message || 'Admin login failed', true);
    }

    currentUser = { role: 'admin' };
    currentAdminPassword = pass;
    updateUIState();
    loadStudentList();
  }

  async function loadPublicData() {
    const { data, error } = await sbClient.from('site_data').select('data').eq('id', 1).single();
    if(!error && data) {
      renderProtectedContent(data.data);
      document.getElementById('site-json-input').value = JSON.stringify(data.data, null, 2);
    }
  }

  // Render Function with Video Protection Controls
  function renderProtectedContent(jsonObj) {
    const display = document.getElementById('content-display');
    display.innerHTML = '';

    const contentStr = JSON.stringify(jsonObj, null, 2);
    const pre = document.createElement('pre');
    pre.textContent = contentStr;
    display.appendChild(pre);

    // Dynamic Video Protection Handler
    const videoUrls = extractVideoUrls(jsonObj);
    if(videoUrls.length > 0) {
      const vidTitle = document.createElement('h3');
      vidTitle.style.marginTop = '20px';
      vidTitle.textContent = 'Protected Class Videos';
      display.appendChild(vidTitle);

      videoUrls.forEach(url => {
        const wrapper = document.createElement('div');
        wrapper.className = 'video-container';
        
        const video = document.createElement('video');
        video.src = url;
        video.controls = true;
        
        // Anti-Sharing & Anti-Download Attributes
        video.setAttribute('controlsList', 'nodownload noremoteplayback noplaybackrate');
        video.setAttribute('disablePictureInPicture', 'true');
        video.setAttribute('oncontextmenu', 'return false;');
        
        wrapper.appendChild(video);
        display.appendChild(wrapper);
      });
    }

    applyVideoProtections();
  }

  function extractVideoUrls(obj) {
    let urls = [];
    const str = JSON.stringify(obj);
    const regex = /(https?:\/\/[^\s"]+\.(?:mp4|webm|m3u8))/g;
    let match;
    while ((match = regex.exec(str)) !== null) {
      urls.push(match[1]);
    }
    return urls;
  }

  function applyVideoProtections() {
    document.querySelectorAll('video').forEach(video => {
      // Disable Context Menu (Right Click)
      video.addEventListener('contextmenu', e => e.preventDefault());
      
      // Disable Dragging
      video.addEventListener('dragstart', e => e.preventDefault());
      
      // Disable Key Shortcuts for video focus
      video.addEventListener('keydown', e => {
        if (e.key === 's' && (e.ctrlKey || e.metaKey)) e.preventDefault();
      });
    });
  }

  async function handleSaveSiteContent() {
    try {
      const jsonData = JSON.parse(document.getElementById('site-json-input').value);
      const { data, error } = await sbClient.rpc('admin_save_site', { p_data: jsonData });
      if(error || !data.success) throw new Error(error?.message || 'Save failed');
      showMessage('Site data updated successfully!');
      loadPublicData();
    } catch(err) {
      showMessage('Invalid JSON or error: ' + err.message, true);
    }
  }

  async function loadStudentList() {
    if(!currentAdminPassword) return;
    const { data, error } = await sbClient.rpc('admin_list_students', { p_password: currentAdminPassword });
    if(error || !data.success) return showMessage('Failed to fetch students', true);

    let html = `<table><tr><th>Name</th><th>Login ID</th><th>Created At</th><th>Action</th></tr>`;
    data.students.forEach(s => {
      html += `<tr>
        <td>${s.name}</td>
        <td>${s.login_id}</td>
        <td>${new Date(s.created_at).toLocaleDateString()}</td>
        <td><button class="btn-secondary" onclick="changeStudentPass('${s.id}')">Change Pass</button></td>
      </tr>`;
    });
    html += `</table>`;
    document.getElementById('student-list-container').innerHTML = html;
  }

  async function changeStudentPass(studentId) {
    const newPass = prompt("Enter new password for student (Min 6 chars):");
    if(!newPass) return;

    const { data, error } = await sbClient.rpc('admin_change_password', {
      p_admin_password: currentAdminPassword,
      p_student_id: studentId,
      p_new_password: newPass
    });

    if(error || !data.success) {
      return showMessage(data?.message || error?.message || 'Failed to change password', true);
    }
    showMessage('Student password updated successfully!');
  }

  async function handleChangeAdminPassword() {
    const oldPass = document.getElementById('old-admin-pass').value;
    const newPass = document.getElementById('new-admin-pass').value;

    const { data, error } = await sbClient.rpc('change_admin_password', {
      p_old_password: oldPass, p_new_password: newPass
    });

    if(error || !data.success) {
      return showMessage(data?.message || error?.message || 'Password update failed', true);
    }
    showMessage('Admin password changed successfully! Please log in again.');
    currentAdminPassword = newPass;
    logout();
  }

  function updateUIState() {
    hideAllViews();
    const userInfo = document.getElementById('user-info');
    const logoutBtn = document.getElementById('btn-logout');

    if(!currentUser) {
      userInfo.innerText = '';
      logoutBtn.classList.add('hidden');
      showAuth('login');
      return;
    }

    logoutBtn.classList.remove('hidden');
    if(currentUser.role === 'student') {
      userInfo.innerText = `Student: ${currentUser.name}`;
      document.getElementById('student-dash').classList.remove('hidden');
      loadPublicData();
    } else if(currentUser.role === 'admin') {
      userInfo.innerText = `Role: Admin`;
      document.getElementById('admin-dash').classList.remove('hidden');
      loadPublicData();
    }
  }

  function logout() {
    currentUser = null;
    currentAdminPassword = "";
    updateUIState();
  }

  // Prevent Right Click Globally on Video Overlay
  document.addEventListener('contextmenu', event => {
    if (event.target.tagName === 'VIDEO') {
      event.preventDefault();
    }
  });
</script>
</body>
</html>
